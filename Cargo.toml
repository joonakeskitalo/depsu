[package]
name = "depsu"
version = "0.1.5"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
ratatui = "0.30.2"
semver = { version = "1.0.28", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
serde_yaml_ng = "0.10.0"
toml = "1.2.1"
ureq = { version = "2", features = ["json"] }
